kind = "web"
previewPath = "/"
title = "Akhil Portfolio"
description = "An Android-style personal portfolio for Akhil, showcasing his journey across data, AI, and engineering through animated charts and focused mobile interactions."
version = "1.0.0"
id = "artifacts/akhil-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25436

[services.development]
run = "pnpm --filter @workspace/akhil-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/akhil-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/akhil-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25436"
BASE_PATH = "/"
